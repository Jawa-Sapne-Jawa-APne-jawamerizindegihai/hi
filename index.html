<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroROM Downloads</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --md-sys-color-primary: #ffb3b8;
            --md-sys-color-on-primary: #680016;
            --md-sys-color-primary-container: #920023;
            --md-sys-color-on-primary-container: #ffddae; 
            
            --md-sys-color-background: #0f0505; 
            --md-sys-color-surface: #200a0a;
            --md-sys-color-surface-variant: #534345;
            
            --md-sys-color-outline: #857375;
            --glow: 0 0 20px rgba(255, 60, 100, 0.15);
            
            --radius-outer: 28px;
            --radius-inner: 16px;
            --font-nerd: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--md-sys-color-background);
            color: #ece0e1;
            font-family: var(--font-nerd);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

     
        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px dashed var(--md-sys-color-surface-variant);
            background: radial-gradient(circle at top, #2a0a10 0%, transparent 70%);
        }

        h1 {
            font-size: 3rem;
            color: var(--md-sys-color-primary);
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: var(--glow);
        }

        .subtitle {
            opacity: 0.7;
            font-size: 0.9rem;
            margin-top: 10px;
        }

    
        .search-wrapper {
            margin: 30px auto;
            max-width: 600px;
            width: 90%;
            position: relative;
        }

        input {
            width: 100%;
            background: var(--md-sys-color-surface);
            border: 2px solid var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-primary);
            padding: 15px 20px;
            border-radius: 50px;
            font-family: var(--font-nerd);
            font-size: 1rem;
            transition: 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: var(--glow);
        }

    
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

   
        .card {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-surface-variant);
            border-radius: var(--radius-outer);
            padding: 25px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

     
        .card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, transparent 50%, var(--md-sys-color-primary-container) 50%);
            opacity: 0.5;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--md-sys-color-primary);
            box-shadow: var(--glow);
        }

        .device-header {
            margin-bottom: 20px;
            border-bottom: 2px dashed #3a151a;
            padding-bottom: 15px;
        }

        .d-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
        }

        .d-code {
            display: inline-block;
            background: #3f1018;
            color: var(--md-sys-color-primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: bold;
        }

    
        .links-area {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2b0e12;
            color: var(--md-sys-color-primary);
            padding: 12px 18px;
            border-radius: var(--radius-inner);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--md-sys-color-primary);
            color: #000;
            font-weight: 700;
        }

        .btn span:first-child {
            opacity: 0.8;
        }

        .btn.primary-dl {
            background: var(--md-sys-color-primary-container);
            color: #fff;
            border: 1px solid var(--md-sys-color-primary);
        }

        .btn.primary-dl:hover {
            background: var(--md-sys-color-primary);
            color: #000;
        }

 
        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.8rem;
            opacity: 0.6;
            border-top: 1px solid #333;
            margin-top: 40px;
        }
        
        footer a { color: var(--md-sys-color-primary); }

    </style>
</head>
<body>

    <header>
        <h1>Supported Devices</h1>
        <div class="subtitle">Downloads for supported devices</div>
    </header>

    <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="> Search your device...">
    </div>

    <div class="container">
        <div class="grid" id="cardGrid">
            </div>
    </div>

    <footer>
        &copy; <span id="year"></span> ProjectAstro. All rights reserved.<br>
        <a href="https://github.com/SameerAlSahab/ProjectAstro" target="_blank">View Source on GitHub</a>
    </footer>

    <script>

        const devices = [
            {
                name: "Galaxy S23 Ultra",
                codename: "dm3q",
                serverName: "PixelDrain",
                downloadLink: "https://pixeldrain.com/u/VVsVmD4D",
                mirror1: "",
            },
            {
                name: "Galaxy S23",
                codename: "dm1q",
                serverName: "PixelDrain",
                downloadLink: "https://pixeldrain.com/u/azdsHGxQ",
            },
            {
                name: "Galaxy S23 Plus",
                codename: "dm2q",
                serverName: "PixelDrain",
                downloadLink: "https://pixeldrain.com/u/ZoJ4ECwd",
                mirror1: "",
                mirror2: ""
            },

        ];


        
        const grid = document.getElementById('cardGrid');
        const searchInput = document.getElementById('searchInput');
        document.getElementById('year').textContent = new Date().getFullYear();

        function renderCards(filterText = "") {
            grid.innerHTML = "";
            
            devices.forEach(device => {
                const match = device.name.toLowerCase().includes(filterText) || 
                              device.codename.toLowerCase().includes(filterText);

                if (match) {
                    const card = document.createElement('div');
                    card.className = 'card';

                    let mirrorsHtml = '';
                    if(device.mirror1) {
                        mirrorsHtml += `<a href="${device.mirror1}" class="btn" target="_blank"><span>Mirror 1</span><span>⬇</span></a>`;
                    }
                    if(device.mirror2) {
                        mirrorsHtml += `<a href="${device.mirror2}" class="btn" target="_blank"><span>Mirror 2</span><span>⬇</span></a>`;
                    }

                    card.innerHTML = `
                        <div class="device-header">
                            <div class="d-name">${device.name}</div>
                            <div class="d-code">&lt;${device.codename}&gt;</div>
                        </div>
                        <div class="links-area">
                            <a href="${device.downloadLink}" class="btn primary-dl" target="_blank">
                                <span>${device.serverName || 'Download'}</span>
                                <span>[GET]</span>
                            </a>
                            ${mirrorsHtml}
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });
        }


        renderCards();

        searchInput.addEventListener('keyup', (e) => {
            renderCards(e.target.value.toLowerCase());
        });

    </script>
</body>
</html>
