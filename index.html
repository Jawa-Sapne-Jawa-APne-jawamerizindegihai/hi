<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroROM Downloads</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0d10;
      --surface: #15171c;
      --card: #1b1e25;
      --border: #2a2e39;
      --text: #e6e8ee;
      --muted: #9aa1b2;
      --accent: #6ee7b7; 
      --accent-2: #60a5fa;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(1200px 600px at top, #11131a 0%, var(--bg) 60%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 20px 32px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .search {
      margin-top: 28px;
      max-width: 420px;
    }

    .search input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.95rem;
    }

    .search input::placeholder { color: var(--muted); }

    .search input:focus {
      outline: none;
      border-color: var(--accent);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: linear-gradient(180deg, var(--card), #161922);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform .2s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .device-name {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .codename {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .actions {
      margin-top: auto;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 120px;
      text-align: center;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
      background: #11131a;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #000;
      border: none;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <h1>AstroROM Downloads</h1>
  <div class="subtitle">Official builds</div>

  <div class="search">
    <input id="search" placeholder="Search device or codename" />
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  © <span id="year"></span> ProjectAstro · <a href="https://github.com/SameerAlSahab/ProjectAstro" target="_blank">GitHub</a>
</footer>

<script>


  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  document.getElementById('year').textContent = new Date().getFullYear();

  let devices = [];

  fetch('devices/index.txt')
    .then(r => r.text())
    .then(list => {
      const files = list.split('\n').map(l => l.trim()).filter(Boolean);
      return Promise.all(files.map(loadDevice));
    })
    .then(data => {
      devices = data;
      render();
    });

  function loadDevice(file) {
    return fetch('devices/' + file)
      .then(r => r.text())
      .then(text => {
        const obj = {};
        text.split('\n').forEach(line => {
          const [k, ...v] = line.split('=');
          if (k && v.length) obj[k.trim()] = v.join('=').trim();
        });
        return obj;
      });
  }

  function render(filter = '') {
    grid.innerHTML = '';

    devices.forEach(d => {
      const match =
        d.name?.toLowerCase().includes(filter) ||
        d.codename?.toLowerCase().includes(filter);

      if (!match) return;

      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div>
          <div class="device-name">${d.name}</div>
          <div class="codename">${d.codename}</div>
        </div>
        <div class="meta">Server: ${d.server}</div>
        <div class="actions">
          <a class="btn primary" href="${d.link}" target="_blank">Download</a>
          ${d.mirror ? `<a class="btn" href="${d.mirror}" target="_blank">Mirror</a>` : ''}
        </div>
      `;

      grid.appendChild(card);
    });
  }

  search.addEventListener('input', e => render(e.target.value.toLowerCase()));
</script>

</body>
</html>
